# ==============================================================================
# Parámetros Centralizados para Vehículo Autónomo TMR
# ==============================================================================

usb_camera_node:
  ros__parameters:
    device_id: 0
    width: 640
    height: 480
    framerate: 30
    jpeg_quality: 75
    frame_id: "camera_optical_frame"
    publish_raw: true

lane_detector_node:
  ros__parameters:
    # --- MODO DE OPERACIÓN ---
    # Para pruebas actuales (cinta negra en baldosas blancas):
    #   invert_binary: true, filter_glare: false, line_thickness_m: 0.02, binary_threshold: 110
    # Para el torneo oficial (cinta blanca de 4 cm en lona negra reflectante):
    #   invert_binary: false, filter_glare: true, line_thickness_m: 0.04, binary_threshold: 160
    invert_binary: true       # true: cinta oscura en fondo claro | false: cinta blanca en lona negra
    filter_glare: false       # Filtro Morfológico Top-Hat (activar en torneo para eliminar reflejos de luces en lona)
    binary_threshold: 110     # Umbral de binarización
    use_otsu: false
    roi_top_pct: 0.42         # Inicio vertical del trapecio (corte de horizonte y pared)
    roi_bottom_pct: 0.98      # Base inferior a 10 cm del frente del auto
    pixels_to_meters: 0.0015  # Escala métrica: 0.60 m / 400 px = 1.5 mm/pixel
    lane_width_m: 0.40        # Ancho oficial del carril: 40 cm (0.40 m)
    car_width_m: 0.18         # Ancho del vehículo: 18 cm (0.18 m)
    target_right_margin_m: 0.04 # Regla oficial TMR: mantener el auto a 4 cm de la línea derecha
    line_thickness_m: 0.02    # Grosor de la cinta: 2 cm en pruebas actuales, 4 cm en torneo
    lookahead_y: 250          # Distancia anticipada de seguimiento en vista IPM (píxeles)
    use_compressed_sub: true  # Suscribirse al stream comprimido para mayor velocidad y menor latencia WiFi

lane_controller_node:
  ros__parameters:
    controller_type: "stanley" # "stanley" (recomendado) o "pid"
    k_stanley: 1.5             # Ganancia de error lateral en Stanley
    epsilon_v: 0.1             # Regularizador para bajas velocidades
    kp: 1.2
    ki: 0.0
    kd: 0.15
    max_steering_angle_rad: 0.52 # ~30 grados máx
    v_min: 0.35                # Velocidad en curvas cerradas (m/s)
    v_max: 0.85                # Velocidad en rectas (m/s)
    k_curvature: 2.0           # Factor de reducción por curvatura
    autonomous_enabled_by_default: true

arduino_bridge_node:
  ros__parameters:
    port: "/dev/ttyUSB0"       # /dev/ttyUSB0 (Arduino Nano/CH340) o /dev/ttyACM0 (Arduino Uno)
    baud_rate: 115200
    servo_center_deg: 90       # Calibración de centro
    servo_range_deg: 35        # Rango útil: 90 +/- 35 (55 a 125 deg)
    max_steering_angle_rad: 0.52
    invert_steering: false     # true si gira al revés
    esc_neutral_us: 1500       # 1500 us = Detenido
    esc_forward_min_us: 1545   # Pulso para vencer la fricción estática
    esc_forward_max_us: 1640   # Límite seguro para pruebas iniciales
    v_max_mps: 1.0
