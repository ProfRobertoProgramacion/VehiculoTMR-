# ==============================================================================
# Instrucciones de Red para Windows 11 + WSL2 (ROS 2 DDS Discovery)
# ==============================================================================
# Copia este contenido en tu archivo .wslconfig ubicado en:
# C:\Users\<Tu_Usuario>\.wslconfig
#
# Luego abre PowerShell como Administrador y ejecuta:
#   wsl --shutdown
# Y vuelve a abrir tu terminal de Ubuntu en WSL2.
# ==============================================================================

[wsl2]
# Habilita el modo de red en espejo para que WSL2 comparta la misma IP del host Windows.
# Esto permite que la Odroid M1S y WSL2 se vean en la misma subred local y funcione Multicast UDP.
networkingMode=mirrored

# Permite que el tráfico entrante a Windows llegue a WSL2
firewall=false

# Auto-reenvío de puertos localhost
autoProxy=true
